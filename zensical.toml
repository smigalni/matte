[project.theme]
language = "nb"
features = [
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
