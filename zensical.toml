[project]
site_name = "R1-matte"
site_description = "Digitale forklaringer, eksempler og oppgaver i matematikk R1"
site_author = "Matteundervisning"
# Legg inn den endelige nettadressen her når nettstedet publiseres:
# site_url = "https://DITT-NETTSTED/"
docs_dir = "docs"
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Hjem" = "index.md" },
  { "R1" = [
    { "Kapittel 3 – Derivasjon" = [
      { "Oversikt" = "r1/derivasjon/index.md" },
    ] },
  ] },
]

[project.theme]
language = "nb"
features = [
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.markdown_extensions]
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
