[project]
site_name = "R1-matte"
site_description = "Digitale forklaringer, eksempler og oppgaver i matematikk R1 og S1"
site_author = "Matteundervisning"
site_url = "https://smigalni.github.io/matte/"
docs_dir = "docs"
extra_css = [
  "stylesheets/extra.css",
]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Hjem" = "index.md" },
  { "R1" = [
    { "Kapittel 3 – Derivasjon" = [
      { "Oversikt" = "r1/derivasjon/index.md" },
      { "3.1 Vekstfart og tangent" = "felles/vekstfart-og-tangent.md" },
      { "3.2 Deriverbarhet" = "r1/derivasjon/deriverbarhet.md" },
    ] },
    { "Programmering" = [
      { "Oversikt" = "felles/programmering/index.md" },
      { "1. Algoritmer og kode" = "felles/programmering/algoritmer-og-kode.md" },
      { "2. Variabler og regning" = "felles/programmering/variabler-og-regning.md" },
      { "3. Oppgaver og fasit" = "felles/programmering/oppgaver.md" },
    ] },
  ] },
  { "S1" = [
    { "Oversikt" = "s1/index.md" },
    { "3.1 Vekstfart og tangent" = "felles/vekstfart-og-tangent.md" },
    { "Programmering" = [
      { "Oversikt" = "felles/programmering/index.md" },
      { "1. Algoritmer og kode" = "felles/programmering/algoritmer-og-kode.md" },
      { "2. Variabler og regning" = "felles/programmering/variabler-og-regning.md" },
      { "3. Oppgaver og fasit" = "felles/programmering/oppgaver.md" },
    ] },
  ] },
]

[project.theme]
language = "nb"
features = [
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
md_in_html = {}

[project.theme.palette]
primary = "indigo"
accent = "teal"
