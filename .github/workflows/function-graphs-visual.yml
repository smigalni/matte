name: R1 function graph visual tests

on:
  push:
    branches:
      - pilot/r1-kapittel-2-isolert
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    name: Build and test function graphs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Zensical and Playwright
        run: |
          python -m pip install --upgrade zensical
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build documentation
        run: zensical build --clean --strict

      - name: Start preview server
        run: |
          python -m http.server 8000 --directory site > /tmp/r1-site.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/r1/funksjonsgrafer-pilot/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/r1-site.log
          exit 1

      - name: Test desktop and mobile rendering
        run: |
          node tests/visuals/function-graphs.spec.cjs
          node tests/visuals/chapter-2-1-graphs.spec.cjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-function-graphs-browser-review
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
