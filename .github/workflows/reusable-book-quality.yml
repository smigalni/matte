name: Reusable book quality checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  markdown-quality:
    name: Markdown structure and math-book style
    runs-on: ubuntu-latest
    steps:
      - name: Check out the book repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the book quality checker
        shell: bash
        run: |
          if [[ "${GITHUB_REPOSITORY}" == "smigalni/matte" ]]; then
            # When developing the shared checker, test the code in this branch.
            echo "BOOK_QUALITY_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          else
            # Book repositories always use the released shared checker from main.
            git clone --depth 1 --branch main https://github.com/smigalni/matte.git .book-quality-tools
            echo "BOOK_QUALITY_ROOT=${GITHUB_WORKSPACE}/.book-quality-tools" >> "${GITHUB_ENV}"
          fi

      - name: Find changed Markdown files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Push checks validate all files changed in each push. The PR check validates its latest commit, so old untouched pages do not block a new change.
            git diff --name-only --diff-filter=ACMR "$PR_HEAD_SHA^" "$PR_HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$HEAD_SHA"
          else
            git ls-files '*.md' '*.markdown'
          fi > changed-files.txt
          echo "Changed Markdown candidates:"
          cat changed-files.txt

      - name: Test the shared checker
        run: python "$BOOK_QUALITY_ROOT/tests/book-quality/test_check_book_format.py"

      - name: Validate changed Markdown
        run: |
          python "$BOOK_QUALITY_ROOT/scripts/book-quality/check_book_format.py" --root . --config .book-quality.toml --files-from changed-files.txt
